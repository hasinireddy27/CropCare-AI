<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CropCare AI crop disease detection website"
    >

    <title>
        {% block title %}CropCare AI{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <header class="navbar">
        <div class="container navbar-content">
            <a class="logo" href="{{ url_for('home') }}">
                CropCare AI
            </a>

            <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('detect') }}">Detect</a>
        <a href="{{ url_for('home') }}#features">Features</a>
        <a href="{{ url_for('home') }}#about">About</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>
                CropCare AI — AI-powered crop disease detection
            </p>
        </div>
    </footer>

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>
</body>
</html>
